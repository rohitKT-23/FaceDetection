# YOLOv8 Face Detection Configuration

# Dataset paths
path: ../data/widerface # dataset root dir
train: images/train # train images (relative to 'path')
val: images/val # val images (relative to 'path')
test: images/test # test images (optional)

# Classes
names:
  0: face

# Number of classes
nc: 1

# Training hyperparameters
# Model
model: yolov8n.pt # pretrained model path

# Image settings
imgsz: 640 # input image size

# Training settings
epochs: 50
batch: 16
workers: 8

# Optimizer
optimizer: AdamW
lr0: 0.001 # initial learning rate
lrf: 0.01 # final learning rate (lr0 * lrf)
momentum: 0.937
weight_decay: 0.0005

# Augmentation
augment: True
hsv_h: 0.015 # image HSV-Hue augmentation (fraction)
hsv_s: 0.7 # image HSV-Saturation augmentation (fraction)
hsv_v: 0.4 # image HSV-Value augmentation (fraction)
degrees: 0.0 # image rotation (+/- deg)
translate: 0.1 # image translation (+/- fraction)
scale: 0.5 # image scale (+/- gain)
shear: 0.0 # image shear (+/- deg)
perspective: 0.0 # image perspective (+/- fraction)
flipud: 0.0 # image flip up-down (probability)
fliplr: 0.5 # image flip left-right (probability)
mosaic: 1.0 # image mosaic (probability)
mixup: 0.0 # image mixup (probability)

# Validation settings
conf: 0.25 # object confidence threshold
iou: 0.45 # IoU threshold for NMS

# Other
device: "" # cuda device, i.e. 0 or 0,1,2,3 or cpu
project: runs/detect
name: yolov8_face
exist_ok: False
pretrained: True
verbose: True
seed: 0
deterministic: True
single_cls: True # treat as single-class dataset
rect: False # rectangular training
cos_lr: False # cosine LR scheduler
close_mosaic: 10 # disable mosaic augmentation for final epochs
resume: False # resume training from last checkpoint
amp: True # Automatic Mixed Precision training
